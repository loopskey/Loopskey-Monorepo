name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve registry namespace
        id: ns
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ steps.ns.outputs.prefix }}/api:latest
            ${{ steps.ns.outputs.prefix }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push front
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.front
          push: true
          build-args: |
            NEXT_PUBLIC_GRAPHQL_URL=${{ vars.NEXT_PUBLIC_GRAPHQL_URL }}
          tags: |
            ${{ steps.ns.outputs.prefix }}/front:latest
            ${{ steps.ns.outputs.prefix }}/front:${{ github.sha }}
          cache-from: type=gha,scope=front
          cache-to: type=gha,scope=front,mode=max

      - name: Summary
        run: |
          {
            echo "| image | tag |"
            echo "| --- | --- |"
            echo "| ${{ steps.ns.outputs.prefix }}/api | \`latest\`, \`${{ github.sha }}\` |"
            echo "| ${{ steps.ns.outputs.prefix }}/front | \`latest\`, \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
