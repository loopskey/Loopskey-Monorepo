name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build and publish
    runs-on: ubuntu-latest
    outputs:
      prefix: ${{ steps.ns.outputs.prefix }}
    steps:
      - uses: actions/checkout@v7

      - name: Require the public GraphQL origin
        env:
          NEXT_PUBLIC_GRAPHQL_URL: ${{ vars.NEXT_PUBLIC_GRAPHQL_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_GRAPHQL_URL" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_GRAPHQL_URL is not set." \
                 "It is baked into the frontend bundle at build time, so an empty" \
                 "value ships a frontend that calls nothing."
            exit 1
          fi
          echo "building the frontend against $NEXT_PUBLIC_GRAPHQL_URL"

      - name: Resolve registry namespace
        id: ns
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ steps.ns.outputs.prefix }}/api:latest
            ${{ steps.ns.outputs.prefix }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push front
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.front
          push: true
          build-args: |
            NEXT_PUBLIC_GRAPHQL_URL=${{ vars.NEXT_PUBLIC_GRAPHQL_URL }}
          tags: |
            ${{ steps.ns.outputs.prefix }}/front:latest
            ${{ steps.ns.outputs.prefix }}/front:${{ github.sha }}
          cache-from: type=gha,scope=front
          cache-to: type=gha,scope=front,mode=max

  deploy:
    name: Deploy to production
    needs: images
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check the deployment secrets are present
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          [ -n "$DEPLOY_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$DEPLOY_SSH_KEY" ] || missing="$missing DEPLOY_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See the Continuous deployment section of the README."
            exit 1
          fi

      - name: Open an authenticated session
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY is not a readable private key. Copy the whole file, including the BEGIN and END lines, keeping every line break; a key pasted as a single line cannot be loaded."
            rm -f ~/.ssh/deploy_key
            exit 1
          fi
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Run the deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p "${DEPLOY_PORT:-22}" \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              "${DEPLOY_USER:-root}@$DEPLOY_HOST" \
              "deploy ${{ github.sha }}"

      - name: Discard the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
