name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loopskey_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d loopskey_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loopskey_test_ci
      # The CI Postgres service is not pooled, so the migration engine can use
      # the same endpoint. The datasource still requires the variable to resolve.
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loopskey_test_ci
      JWT_ACCESS_SECRET: ci-test-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-characters
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Turborepo drives all three applications, and the AI service's tasks
      # shell out to uv. It must exist before any `turbo run`, not only before
      # the Python-specific steps.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/service-ai/uv.lock

      - name: Install
        run: npm ci

      - name: Install AI service dependencies
        run: uv sync --all-groups --project apps/service-ai

      - name: Generate Prisma Client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            turbo-${{ runner.os }}-

      - name: Lint
        run: npx turbo run lint --affected

      - name: Type check
        run: npx turbo run check-types --affected

      - name: Test
        run: npx turbo run test --affected

      - name: Build API contracts for E2E
        run: npm run build --workspace @loopskey/api-contracts

      - name: API end-to-end tests
        run: npm run test:e2e --workspace api

      - name: Build
        run: npx turbo run build --affected

      - name: Check generated GraphQL types
        shell: bash
        run: |
          npm run codegen --workspace front
          git diff --exit-code -- apps/front/src/lib/graphql/generated.ts

      # The equivalent gate for the AI boundary is
      # apps/service-ai/tests/test_openapi_contract.py, which runs in the Test
      # step above. It compares the committed openapi.json against the live
      # application, so no separate regenerate-and-diff step is needed here.
