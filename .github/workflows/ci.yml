name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loopskey_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d loopskey_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loopskey_test_ci
      # The CI Postgres service is not pooled, so the migration engine can use
      # the same endpoint. The datasource still requires the variable to resolve.
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loopskey_test_ci
      JWT_ACCESS_SECRET: ci-test-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-characters
      # A reserved-TLD fixture origin: the frontend build requires a sanitized
      # https origin, and CI must not need the production domain or its secrets.
      NEXT_PUBLIC_SITE_URL: https://ci.loopskey.invalid
      DEPLOYMENT_ENV: ci
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Generate Prisma Client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            turbo-${{ runner.os }}-

      - name: Lint
        run: npx turbo run lint --affected

      - name: Type check
        run: npx turbo run check-types --affected

      - name: Test
        run: npx turbo run test --affected

      - name: Build API contracts for E2E
        run: npm run build --workspace @loopskey/api-contracts

      - name: API end-to-end tests
        run: npm run test:e2e --workspace api

      - name: Build
        run: npx turbo run build --affected

      - name: Check public JavaScript targets and ceilings
        shell: bash
        run: |
          if [ ! -f apps/front/.next/BUILD_ID ]; then
            echo "The frontend was not built in this run, so there is nothing to measure."
            exit 0
          fi
          npm run bundle-report --workspace front -- --check-targets --check-ceilings

      - name: Check generated GraphQL types
        shell: bash
        run: |
          npm run codegen --workspace front
          if [ -n "$(git status --porcelain -- apps/front/src/lib/graphql)" ]; then
            echo "::error::The generated GraphQL output is out of date. Run npm run codegen --workspace front and commit apps/front/src/lib/graphql."
            git status --short -- apps/front/src/lib/graphql
            git diff --stat -- apps/front/src/lib/graphql
            exit 1
          fi

      - name: Check deployment configuration
        run: |
          node scripts/check-deployment-config.mjs
          node scripts/check-deployment-config.mjs --self-test
          node scripts/deployment-policy.mjs --self-test
          node scripts/seed-sitemap-fixture.cjs --self-test

      - name: SEO diagnostic self-test
        run: node scripts/seo-audit.mjs --self-test

      - name: Performance lab self-test
        run: |
          node scripts/perf-lab.mjs --self-test
          node scripts/perf-fixture-api.mjs --self-test

      - name: Audit the production build
        shell: bash
        run: |
          if [ ! -f apps/front/.next/BUILD_ID ]; then
            echo "The frontend was not built in this run, so there is nothing to audit."
            exit 0
          fi
          (cd apps/front && npx next start --port 3100 > ../../seo-audit-server.log 2>&1 &)
          ready=""
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3100/about; then ready=yes; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "::error::The production build did not start."
            cat seo-audit-server.log
            exit 1
          fi
          node scripts/seo-audit.mjs \
            --base-url http://127.0.0.1:3100 \
            --site-origin "$NEXT_PUBLIC_SITE_URL" \
            --environment "$DEPLOYMENT_ENV" \
            --profile static
          node scripts/seo-audit.mjs \
            --base-url http://127.0.0.1:3100 \
            --site-origin "$NEXT_PUBLIC_SITE_URL" \
            --environment "$DEPLOYMENT_ENV" \
            --profile hosts

  api-image:
    name: API image dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Decide whether the image inputs changed
        id: inputs
        shell: bash
        run: |
          base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^(Dockerfile.api|package.json|package-lock.json|apps/api/package.json|packages/api-contracts/package.json|scripts/check-api-image-dependencies.mjs)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the API image
        if: steps.inputs.outputs.changed == 'true'
        run: docker build -f Dockerfile.api -t loopskey-api:ci .

      - name: Check the image carries every runtime dependency
        if: steps.inputs.outputs.changed == 'true'
        run: |
          docker run --rm \
            -v "$PWD/scripts:/check:ro" \
            --entrypoint node \
            loopskey-api:ci /check/check-api-image-dependencies.mjs /app

  front-image:
    name: Frontend image policy and sitemap
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Decide whether the image inputs changed
        id: inputs
        shell: bash
        run: |
          base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^(Dockerfile\.front|Dockerfile\.api|compose\.production\.yaml|package-lock\.json|\.github/workflows/(ci|release)\.yml|scripts/(deployment-policy|verify-front-image|seed-sitemap-fixture|seo-audit|check-deployment-config|deploy)[^/]*|apps/front/next\.config\.ts|apps/front/src/lib/(site|sitemap)/.*|apps/front/src/app/(robots\.ts|sitemap\.xml/.*|sitemaps/.*|\[locale\]/layout\.tsx))$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the images
        if: steps.inputs.outputs.changed == 'true'
        run: |
          docker build -f Dockerfile.api -t loopskey-api:ci .
          for environment in production staging; do
            docker build -f Dockerfile.front -t "loopskey-front:ci-$environment" \
              --build-arg NEXT_PUBLIC_SITE_URL=https://www.matrix.invalid \
              --build-arg SITE_CANONICAL_HOST_ALIASES=matrix.invalid \
              --build-arg SITE_HTTPS_REDIRECT=true \
              --build-arg DEPLOYMENT_ENV="$environment" \
              --build-arg BUILD_SHA="${{ github.sha }}" .
          done

      - name: Verify the policy guard, the sitemap and the smoke check
        if: steps.inputs.outputs.changed == 'true'
        run: |
          node scripts/verify-front-image.mjs \
            --front-production loopskey-front:ci-production \
            --front-staging loopskey-front:ci-staging \
            --api-image loopskey-api:ci \
            --courses 12053 \
            --site-origin https://www.matrix.invalid
