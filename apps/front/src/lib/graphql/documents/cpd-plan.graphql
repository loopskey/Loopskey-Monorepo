fragment CertificationCategoryFields on CertificationCategory {
  id
  name
  requiredCredits
  order
}

fragment CertificationFields on Certification {
  id
  name
  abbreviation
  organization
  organizationAbbr
  association
  creditType
  renewalCycleLabel
  renewalCycleMonths
  totalRequiredCredits
  isActive
  categories {
    ...CertificationCategoryFields
  }
}

fragment CpdPlanCategoryFields on CpdPlanCategory {
  id
  name
  targetCredits
  completedCredits
  order
}

fragment CpdPlanFields on CpdPlan {
  id
  certificationId
  certificationName
  organization
  reportingStart
  reportingEnd
  creditType
  totalRequiredCredits
  initialCompletedCredits
  timeAvailable
  preferredFormats
  evidenceTypes
  evidenceOtherNote
  reportRecipientType
  reportRecipientLabel
  remindersEnabled
  reminderTiming
  status
  categories {
    ...CpdPlanCategoryFields
  }
  createdAt
  updatedAt
}

fragment CpdCategoryProgressFields on CpdCategoryProgress {
  id
  name
  target
  completed
  remaining
  progress
  isComplete
}

fragment CpdMissingRequirementFields on CpdMissingRequirement {
  code
  detail
}

fragment CpdPlanProgressFields on CpdPlanProgress {
  planId
  earnedCredits
  startingCredits
  initialCompletedCredits
  activityCredits
  totalRequiredCredits
  remainingCredits
  progressPercent
  categoriesMissing
  evidenceMissing
  activitiesCounted
  complianceStatus
  reportingExpired
  reportingNotStarted
  categories {
    ...CpdCategoryProgressFields
  }
  missingRequirements {
    ...CpdMissingRequirementFields
  }
}

fragment CpdReportRecipientOptionFields on CpdReportRecipientOption {
  type
  label
  description
}

fragment CpdPlanActivityFields on ProfessionalPduActivity {
  id
  title
  date
  pdus
  status
  source
  category
  creditType
  evidenceFiles {
    id
  }
}

fragment AssociationMyRequirementFields on AssociationMyRequirement {
  requirementId
  assignmentId
  name
  description
  associationId
  associationName
  creditType
  evidencePolicy
  requiredCredits
  completedCredits
  remainingCredits
  percent
  band
  dueDate
  daysRemaining
  awaitingReviewCount
  isMissingEvidence
  cycleStart
  cycleEnd
}

fragment AssociationMyRequirementDetailFields on AssociationMyRequirementDetail {
  requirementId
  assignmentId
  name
  description
  associationId
  associationName
  creditType
  evidencePolicy
  requiredCredits
  completedCredits
  remainingCredits
  percent
  band
  dueDate
  daysRemaining
  awaitingReviewCount
  isMissingEvidence
  cycleStart
  cycleEnd
  categories {
    id
    name
    requiredCredits
    completedCredits
    mappedCategory
    percent
  }
  activities {
    activityId
    title
    date
    category
    credits
    creditedAmount
    state
    isLate
    hasEvidence
    categoryName
    reviewNote
  }
  learningContents {
    id
    title
    provider
    imageUrl
    isExternal
    isAvailable
    isCompleted
    isLinkedToRequirement
    contentType
    contentId
    slug
    externalUrl
    description
    category
    indicativeCredits
  }
}

fragment AssociationMyLearningContentFields on AssociationMyRequirementContent {
  id
  title
  provider
  imageUrl
  isExternal
  isAvailable
  isCompleted
  isLinkedToRequirement
  associationId
  associationName
  contentType
  contentId
  slug
  externalUrl
  description
  category
  indicativeCredits
}

query CertificationSearch($input: CertificationSearchInput!) {
  certificationSearch(input: $input) {
    ...CertificationFields
  }
}

query MyCpdPlans {
  myCpdPlans {
    ...CpdPlanFields
  }
}

query MyDraftCpdPlans {
  myDraftCpdPlans {
    ...CpdPlanFields
  }
}

query CpdPlan($planId: ID!) {
  cpdPlan(planId: $planId) {
    ...CpdPlanFields
  }
}

query CpdPlanProgress($planId: ID!) {
  cpdPlanProgress(planId: $planId) {
    ...CpdPlanProgressFields
  }
}

query CpdReportRecipients {
  cpdReportRecipients {
    ...CpdReportRecipientOptionFields
  }
}

query CpdPlanActivities($planId: ID!) {
  cpdPlanActivities(planId: $planId) {
    ...CpdPlanActivityFields
  }
}

query MyAssociationRequirements {
  myAssociationRequirements {
    ...AssociationMyRequirementFields
  }
}

query MyAssociationRequirement($requirementId: ID!) {
  myAssociationRequirement(requirementId: $requirementId) {
    ...AssociationMyRequirementDetailFields
  }
}

query MyAssociationLearningContent {
  myAssociationLearningContent {
    ...AssociationMyLearningContentFields
  }
}

fragment AssociationContentEndorsementFields on AssociationContentEndorsement {
  requirementId
  associationName
  learningContentId
  isDefaultRequirement
}

query MyContentEndorsement($contentType: ContentType!, $contentId: ID!) {
  myContentEndorsement(contentType: $contentType, contentId: $contentId) {
    ...AssociationContentEndorsementFields
  }
}

mutation CreateCpdPlan($input: CreateCpdPlanInput!) {
  createCpdPlan(input: $input) {
    ...CpdPlanFields
  }
}

mutation CreateCpdPlanFromSuggestion(
  $input: CreateCpdPlanFromSuggestionInput!
) {
  createCpdPlanFromSuggestion(input: $input) {
    ...CpdPlanFields
  }
}

mutation ActivateCpdPlan($planId: ID!) {
  activateCpdPlan(planId: $planId) {
    ...CpdPlanFields
  }
}

mutation UpdateCpdPlan($input: UpdateCpdPlanInput!) {
  updateCpdPlan(input: $input) {
    ...CpdPlanFields
  }
}

mutation DeleteCpdPlan($planId: ID!) {
  deleteCpdPlan(planId: $planId) {
    id
  }
}
