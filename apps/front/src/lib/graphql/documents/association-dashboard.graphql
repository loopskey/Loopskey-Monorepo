# ================= Fragments =================
fragment AssociationSettingsFields on AssociationSettings {
  id
  associationId
  defaultCreditType
  onTrackThreshold
  atRiskThreshold
  renewalRequiresReviewedEvidence
  complianceReminders
  welcomeMessages
  weeklyDigest
  createdAt
  updatedAt
}

fragment AssociationFields on Association {
  id
  name
  logoUrl
  description
  country
  website
  contactEmail
  ownerEmail
  ownerFullName
  ownerStatus
  createdAt
  updatedAt
  settings {
    ...AssociationSettingsFields
  }
}

# ================= Profile =================
query AssociationProfile {
  associationProfile {
    ...AssociationFields
  }
}

mutation UpdateAssociationProfile($input: UpdateAssociationProfileInput!) {
  updateAssociationProfile(input: $input) {
    ...AssociationFields
  }
}

# ================= Admin account provisioning =================
mutation CreateAssociationAccount($input: CreateAssociationAccountInput!) {
  createAssociationAccount(input: $input) {
    code
    success
    message
    association {
      ...AssociationFields
    }
  }
}

mutation ResendAssociationActivation(
  $input: ResendAssociationActivationInput!
) {
  resendAssociationActivation(input: $input) {
    code
    success
    message
  }
}

# ================= Members and groups =================
fragment AssociationMemberGroupFields on AssociationMemberGroup {
  id
  title
  isActive
}

fragment AssociationMemberFields on AssociationMember {
  id
  userId
  fullName
  email
  avatarUrl
  memberNumber
  notes
  status
  invitedAt
  activatedAt
  deactivatedAt
  group {
    ...AssociationMemberGroupFields
  }
}

fragment AssociationGroupFields on AssociationGroup {
  id
  title
  description
  isActive
  memberCount
  createdAt
  updatedAt
}

query AssociationMembers(
  $filter: AssociationMemberFilterInput
  $pagination: AssociationPaginationInput
) {
  associationMembers(filter: $filter, pagination: $pagination) {
    totalCount
    pageInfo {
      hasNextPage
      nextCursor
    }
    items {
      ...AssociationMemberFields
    }
  }
}

query AssociationMemberStats {
  associationMemberStats {
    totalMembers
    activeMembers
    pendingActivation
  }
}

query AssociationGroups {
  associationGroups {
    ...AssociationGroupFields
  }
}

mutation InviteAssociationMember($input: InviteAssociationMemberInput!) {
  inviteAssociationMember(input: $input) {
    outcome
    member {
      ...AssociationMemberFields
    }
  }
}

mutation BulkInviteAssociationMembers(
  $input: BulkInviteAssociationMembersInput!
) {
  bulkInviteAssociationMembers(input: $input) {
    totalRows
    invited
    linked
    failed
    failures {
      row
      email
      code
      reason
    }
  }
}

mutation UpdateAssociationMember($input: UpdateAssociationMemberInput!) {
  updateAssociationMember(input: $input) {
    ...AssociationMemberFields
  }
}

mutation SetAssociationMemberStatus($input: SetAssociationMemberStatusInput!) {
  setAssociationMemberStatus(input: $input) {
    ...AssociationMemberFields
  }
}

mutation ResendAssociationMemberInvitation(
  $input: ResendAssociationMemberInvitationInput!
) {
  resendAssociationMemberInvitation(input: $input) {
    ...AssociationMemberFields
  }
}

mutation CreateAssociationGroup($input: CreateAssociationGroupInput!) {
  createAssociationGroup(input: $input) {
    ...AssociationGroupFields
  }
}

mutation UpdateAssociationGroup($input: UpdateAssociationGroupInput!) {
  updateAssociationGroup(input: $input) {
    ...AssociationGroupFields
  }
}

mutation SetAssociationGroupActive($input: SetAssociationGroupActiveInput!) {
  setAssociationGroupActive(input: $input) {
    ...AssociationGroupFields
  }
}

# ================= Member detail and evidence review =================
fragment AssociationCategoryProgressFields on AssociationCategoryProgress {
  id
  name
  percent
  requiredCredits
  completedCredits
}

fragment AssociationAssignmentProgressFields on AssociationAssignmentProgress {
  id
  requirementId
  requirementName
  creditType
  evidencePolicy
  requiredCredits
  completedCredits
  percent
  band
  cycleStart
  cycleEnd
  dueDate
  daysRemaining
  awaitingReviewCount
  isMissingEvidence
  computedAt
  categories {
    ...AssociationCategoryProgressFields
  }
}

fragment AssociationEvidenceFileFields on AssociationEvidenceFile {
  id
  fileName
  mimeType
  sizeBytes
}

fragment AssociationMemberActivityFields on AssociationMemberActivity {
  id
  memberId
  title
  source
  category
  creditType
  credits
  date
  state
  isLate
  canReview
  hasEvidence
  evidenceNote
  evidenceUrl
  reviewNote
  files {
    ...AssociationEvidenceFileFields
  }
  requirements {
    id
    name
    canReview
    creditedAmount
  }
}

query AssociationMemberProfile($memberId: ID!) {
  associationMemberProfile(memberId: $memberId) {
    isMissingEvidence
    member {
      ...AssociationMemberFields
    }
    summary {
      percent
      band
      creditsRequired
      creditsCompleted
      creditsRemaining
      awaitingReviewCount
      nearestDueDate
      nearestDueDays
      nearestRequirementId
      nearestRequirementName
      pacePercent
    }
    assignments {
      ...AssociationAssignmentProgressFields
    }
    cumulative {
      date
      credits
      requiredCredits
    }
    certificates {
      id
      memberId
      title
      issuer
      issuedAt
      validUntil
      status
      creditsEarned
      files {
        ...AssociationEvidenceFileFields
      }
    }
  }
}

query AssociationMemberActivities(
  $memberId: ID!
  $filter: AssociationMemberActivityFilterInput
  $pagination: AssociationPaginationInput
) {
  associationMemberActivities(
    memberId: $memberId
    filter: $filter
    pagination: $pagination
  ) {
    totalCount
    counts {
      counted
      rejected
      awaitingReview
    }
    pageInfo {
      hasNextPage
      nextCursor
    }
    items {
      ...AssociationMemberActivityFields
    }
  }
}

query AssociationMemberRequirementOptions($memberId: ID!) {
  associationMemberRequirementOptions(memberId: $memberId) {
    id
    name
    deadline
    creditType
    audienceKind
    isAssigned
    isMemberManaged
    totalRequiredCredits
  }
}

mutation ReviewAssociationLearningActivity(
  $input: ReviewAssociationLearningActivityInput!
) {
  reviewAssociationLearningActivity(input: $input) {
    approved
    memberId
    activityId
    requirementId
  }
}

mutation SetAssociationMemberRequirements(
  $input: SetAssociationMemberRequirementsInput!
) {
  setAssociationMemberRequirements(input: $input) {
    memberId
    added
    removed
  }
}

# ================= Learning content =================
fragment AssociationLearningContentFields on AssociationLearningContent {
  id
  title
  isExternal
  isAvailable
  contentType
  contentId
  provider
  imageUrl
  externalUrl
  description
  category
  indicativeCredits
  requirementId
  requirementName
  groupId
  groupTitle
  status
  audienceKind
  publishedAt
  withdrawnAt
  createdAt
  updatedAt
}

query AssociationLearningContents(
  $filter: AssociationLearningContentFilterInput
  $pagination: AssociationPaginationInput
) {
  associationLearningContents(filter: $filter, pagination: $pagination) {
    totalCount
    pageInfo {
      hasNextPage
      nextCursor
    }
    items {
      ...AssociationLearningContentFields
    }
  }
}

query AssociationLearningContent($learningContentId: ID!) {
  associationLearningContent(learningContentId: $learningContentId) {
    ...AssociationLearningContentFields
    engagement {
      memberCount
      credits
    }
  }
}

query AssociationCatalogSearch($input: AssociationCatalogSearchInput!) {
  associationCatalogSearch(input: $input) {
    contentType
    contentId
    title
    provider
    imageUrl
    isAvailable
  }
}

mutation CreateAssociationLearningContent(
  $input: CreateAssociationLearningContentInput!
) {
  createAssociationLearningContent(input: $input) {
    ...AssociationLearningContentFields
  }
}

mutation UpdateAssociationLearningContent(
  $input: UpdateAssociationLearningContentInput!
) {
  updateAssociationLearningContent(input: $input) {
    ...AssociationLearningContentFields
  }
}

mutation PublishAssociationLearningContent(
  $input: PublishAssociationLearningContentInput!
) {
  publishAssociationLearningContent(input: $input) {
    ...AssociationLearningContentFields
  }
}

mutation WithdrawAssociationLearningContent(
  $input: AssociationLearningContentIdInput!
) {
  withdrawAssociationLearningContent(input: $input) {
    ...AssociationLearningContentFields
  }
}

mutation DeleteAssociationLearningContent(
  $input: AssociationLearningContentIdInput!
) {
  deleteAssociationLearningContent(input: $input) {
    code
    success
    message
  }
}

query AssociationRequirementOptions($pagination: AssociationPaginationInput) {
  associationRequirements(pagination: $pagination) {
    items {
      id
      name
      status
    }
  }
}

# ================= Reports =================
fragment AssociationReportSummaryFields on AssociationReportSummary {
  periodStart
  periodEnd
  computedAt
  totalMembers
  totalMembersChange
  renewalReady
  renewalReadyShare
  renewalReadyChange
  onTrack
  onTrackShare
  onTrackChange
  atRisk
  atRiskShare
  atRiskChange
  missingEvidence
  missingEvidenceShare
  missingEvidenceChange
  averageCompletion
}

fragment AssociationGroupComplianceFields on AssociationGroupCompliance {
  groupId
  groupTitle
  memberCount
  averageCompletion
  renewalReady
  onTrack
  atRisk
  notStarted
}

fragment AssociationCategoryProgressRowFields on AssociationCategoryProgressRow {
  categoryId
  categoryName
  mappedCategory
  requirementId
  requirementName
  requiredCredits
  averageCompletedCredits
  averagePercent
  memberCount
  onTrackCount
  behindCount
  atRiskCount
  belowHalfCount
}

fragment AssociationMemberDistributionFields on AssociationMemberDistribution {
  totalMembers
  renewalReady
  renewalReadyShare
  onTrack
  onTrackShare
  atRisk
  atRiskShare
  notStarted
  notStartedShare
}

fragment AssociationComplianceTrendFields on AssociationComplianceTrendPoint {
  at
  totalMembers
  renewalReady
  renewalReadyShare
  onTrack
  onTrackShare
  atRisk
  atRiskShare
  notStarted
  notStartedShare
  averageCompletion
}

query AssociationReportsOverview($filter: AssociationReportFilterInput) {
  associationReportSummary(filter: $filter) {
    ...AssociationReportSummaryFields
  }
  associationMemberDistribution(filter: $filter) {
    ...AssociationMemberDistributionFields
  }
  associationComplianceByGroup(filter: $filter) {
    ...AssociationGroupComplianceFields
  }
  associationProgressByCategory(filter: $filter) {
    ...AssociationCategoryProgressRowFields
  }
  associationComplianceTrend(filter: $filter) {
    ...AssociationComplianceTrendFields
  }
}

query AssociationProgressByCategory($filter: AssociationReportFilterInput) {
  associationProgressByCategory(filter: $filter) {
    ...AssociationCategoryProgressRowFields
  }
}

query AssociationMemberProgressReport(
  $filter: AssociationReportFilterInput
  $pagination: AssociationReportPaginationInput
) {
  associationMemberProgressReport(filter: $filter, pagination: $pagination) {
    totalCount
    pageInfo {
      hasNextPage
      nextCursor
    }
    items {
      memberId
      fullName
      email
      memberNumber
      groupTitle
      band
      percent
      requiredCredits
      completedCredits
      awaitingReviewCount
      isMissingEvidence
      hasStarted
      earliestUnmetDeadline
    }
  }
}

query AssociationGroupProgressReport($filter: AssociationReportFilterInput) {
  associationGroupProgressReport(filter: $filter) {
    groupId
    groupTitle
    memberCount
    averageCompletion
    renewalReady
    onTrack
    atRisk
    notStarted
    notStartedCount
    missingEvidenceCount
  }
}

query AssociationCategoryCompletionReport(
  $filter: AssociationReportFilterInput
) {
  associationCategoryCompletionReport(filter: $filter) {
    ...AssociationCategoryProgressRowFields
  }
}

query AssociationMissingEvidenceReport(
