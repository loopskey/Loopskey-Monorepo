# ================ Fragments ==============
fragment CourseFields on Course {
  id
  slug
  title
  instructor
  imageUrl
  sourceUrl
  description
  category
  level
  status
  price
  currency
  isFree
  durationMinutes
  lastUpdatedAt
  requirements
  learnings
  rating
  ratingCount
  professionals
  isFeatured
  providerId
  createdAt
  updatedAt
  deletedAt
}

fragment CoursePageInfoFields on CoursePageInfo {
  nextCursor
  hasNextPage
  previousCursor
  hasPreviousPage
}

# ============= Queries ================
fragment CourseLocaleFields on Course {
  contentLanguage
  availableLocales
}

query Courses(
  $filter: CourseFilterInput
  $pagination: CoursePaginationInput
  $sort: CourseSortInput
  $locale: AppLanguage
) {
  courses(
    filter: $filter
    pagination: $pagination
    sort: $sort
    locale: $locale
  ) {
    items {
      ...CourseFields
      ...CourseLocaleFields
    }
    totalCount
    pageInfo {
      ...CoursePageInfoFields
    }
  }
}

query CourseById($courseId: String!) {
  courseById(courseId: $courseId) {
    ...CourseFields
  }
}

query CourseBySlug($slug: String!, $locale: AppLanguage) {
  courseBySlug(slug: $slug, locale: $locale) {
    ...CourseFields
    ...CourseLocaleFields
  }
}

query FeaturedCourses($take: Int) {
  featuredCourses(take: $take) {
    ...CourseFields
  }
}

query MyProviderCourses(
  $filter: CourseFilterInput
  $pagination: CoursePaginationInput
  $sort: CourseSortInput
) {
  myProviderCourses(filter: $filter, pagination: $pagination, sort: $sort) {
    items {
      ...CourseFields
    }
    totalCount
    pageInfo {
      ...CoursePageInfoFields
    }
  }
}

# ================ Mutations ================
mutation CreateCourse($input: CreateCourseInput!) {
  createCourse(input: $input) {
    ...CourseFields
  }
}

mutation UpdateCourse($input: UpdateCourseInput!) {
  updateCourse(input: $input) {
    ...CourseFields
  }
}

mutation PublishCourse($courseId: String!) {
  publishCourse(courseId: $courseId) {
    ...CourseFields
  }
}

mutation ArchiveCourse($courseId: String!) {
  archiveCourse(courseId: $courseId) {
    ...CourseFields
  }
}

mutation DeleteCourse($courseId: String!) {
  deleteCourse(courseId: $courseId) {
    ...CourseFields
  }
}

mutation RestoreCourse($courseId: String!) {
  restoreCourse(courseId: $courseId) {
    ...CourseFields
  }
}

query CourseFilterFacets {
  courseFilterFacets {
    categories {
      value
      count
    }
    levels {
      value
      count
    }
    ratings {
      minimum
      count
    }
  }
}
