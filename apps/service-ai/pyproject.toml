[project]
name = "service-ai"
version = "0.0.1"
description = "Loopskey AI service — inference, embeddings and retrieval behind a private REST contract"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/service_ai"]

# ---------------------------------------------------------------------------
# Lint and format. Line length matches the repository Prettier setting so
# Markdown and code wrap at the same column.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # import ordering
    "B",      # bugbear
    "UP",     # pyupgrade
    "ASYNC",  # async correctness
    "S",      # security (bandit)
    "RUF",
]
ignore = [
    "S104",   # binding 0.0.0.0 is the container default; the host is configurable
]

[tool.ruff.lint.per-file-ignores]
# Assertions are the point of a test file.
"tests/**" = ["S101"]

# ---------------------------------------------------------------------------
# Types. `strict` is the closest equivalent to the TypeScript strict mode both
# other applications run, and it already forbids untyped defs, implicit
# Optional and bare generics.
#
# `disallow_any_explicit` is deliberately NOT enabled: Pydantic's synthesized
# `__init__(**data: Any)` makes it fire on every `class X(BaseModel)` line, so
# it would only buy a file full of `# type: ignore`.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["service_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
