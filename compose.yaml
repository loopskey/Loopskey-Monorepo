name: loopskey

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loopskey}
      POSTGRES_USER: ${POSTGRES_USER:-loopskey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loopskey_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        DB_PASSWORD_ENCODED=$$(node -p "encodeURIComponent(process.env.POSTGRES_PASSWORD)") &&
        export DATABASE_URL=postgresql://$${POSTGRES_USER}:$${DB_PASSWORD_ENCODED}@db:5432/$${POSTGRES_DB} &&
        export DIRECT_DATABASE_URL=$${DATABASE_URL} &&
        npx prisma migrate deploy --schema apps/api/prisma/schema.prisma &&
        node apps/api/dist/src/main.js
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 5700
      FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}
      APPLICATION_BASE_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}
      POSTGRES_DB: ${POSTGRES_DB:-loopskey}
      POSTGRES_USER: ${POSTGRES_USER:-loopskey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loopskey_change_me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env.docker}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env.docker}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?Set SESSION_SECRET_KEY in .env.docker}
      GRAPHQL_PLAYGROUND: ${GRAPHQL_PLAYGROUND:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      PDU_UPLOAD_DIR: /app/uploads/pdu
      CERTIFICATE_UPLOAD_DIR: /app/uploads/certificates
      AVATAR_UPLOAD_DIR: /app/uploads/avatars
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@example.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-re_docker_local_placeholder}
      EMAIL_FROM: ${EMAIL_FROM:-LoopsKey <notifications@example.com>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-docker-local-google-client}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-docker-local-google-secret}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:5700/auth/google/callback}
      GOOGLE_CALENDAR_REDIRECT: ${GOOGLE_CALENDAR_REDIRECT:-http://localhost:5700/auth/google/calendar/callback}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-docker-local-linkedin-client}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-docker-local-linkedin-secret}
      LINKEDIN_CALLBACK_URL: ${LINKEDIN_CALLBACK_URL:-http://localhost:5700/auth/linkedin/callback}
      OAUTH_REDIRECT_URL: ${OAUTH_REDIRECT_URL:-http://localhost:3000/auth/oauth/bridge}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-docker-local-oauth-state-secret-change-in-production}
      OAUTH_STATE_COOKIE_NAME: ${OAUTH_STATE_COOKIE_NAME:-oauth_state}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${API_PORT:-5700}:5700"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5700/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  front:
    build:
      context: .
      dockerfile: Dockerfile.front
      args:
        NEXT_PUBLIC_GRAPHQL_URL: ${NEXT_PUBLIC_GRAPHQL_URL:-http://localhost:5700/graphql}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?Set SESSION_SECRET_KEY in .env.docker}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env.docker}
      ACCESS_TOKEN_COOKIE_NAME: ${ACCESS_TOKEN_COOKIE_NAME:-}
    ports:
      - "${FRONT_PORT:-3000}:3000"

volumes:
  postgres_data:
  uploads_data:
