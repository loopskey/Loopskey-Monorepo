name: loopskey

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.docker}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.docker}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${API_IMAGE:-loopskey-api:latest}
    build:
      context: .
      dockerfile: Dockerfile.api

    restart: unless-stopped

    env_file:
      - .env.docker

    environment:
      NODE_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 5700

      FRONTEND_URL: ${PUBLIC_FRONTEND_URL:?set PUBLIC_FRONTEND_URL in .env.docker}
      APPLICATION_BASE_URL: ${PUBLIC_FRONTEND_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env.docker}

      GRAPHQL_PLAYGROUND: "false"

      PDU_UPLOAD_DIR: /app/uploads/pdu
      CERTIFICATE_UPLOAD_DIR: /app/uploads/certificates
      AVATAR_UPLOAD_DIR: /app/uploads/avatars
      LOGO_UPLOAD_DIR: /app/uploads/logos
      REPORT_STORAGE_DIR: /app/uploads/reports

      ORGANIZATION_LOGIN_URL: ${PUBLIC_FRONTEND_URL}/auth/organization
      ORGANIZATION_ACTIVATION_URL: ${PUBLIC_FRONTEND_URL}/auth/organization/activate
      ASSOCIATION_LOGIN_URL: ${PUBLIC_FRONTEND_URL}/auth/professional
      ASSOCIATION_ACTIVATION_URL: ${PUBLIC_FRONTEND_URL}/auth/association/activate

    command:
      - sh
      - -c
      - >-
        DB_PASSWORD_ENCODED=$$(node -p "encodeURIComponent(process.env.POSTGRES_PASSWORD)") &&
        export DATABASE_URL=postgresql://$${POSTGRES_USER}:$${DB_PASSWORD_ENCODED}@db:5432/$${POSTGRES_DB} &&
        export DIRECT_DATABASE_URL=$${DATABASE_URL} &&
        npx prisma migrate deploy --schema apps/api/prisma/schema.prisma &&
        node apps/api/dist/src/main.js

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - uploads_data:/app/uploads

    ports:
      - "127.0.0.1:${API_PORT:-5700}:5700"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5700/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  front:
    image: ${FRONT_IMAGE:-loopskey-front:latest}
    build:
      context: .
      dockerfile: Dockerfile.front
      args:
        NEXT_PUBLIC_GRAPHQL_URL: ${NEXT_PUBLIC_GRAPHQL_URL:?set NEXT_PUBLIC_GRAPHQL_URL in .env.docker}

    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    environment:
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?set SESSION_SECRET_KEY in .env.docker}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env.docker}
      ACCESS_TOKEN_COOKIE_NAME: ${ACCESS_TOKEN_COOKIE_NAME:-}

    ports:
      - "127.0.0.1:${FRONT_PORT:-3000}:3000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(()=>process.exit(0)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  uploads_data:
